<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL LIVE BATTLE 🏆</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root { --accent: #fbb03b; --bg: #050505; --glass: rgba(255, 255, 255, 0.05); }
    body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
    
    .app { max-width: 480px; margin: 0 auto; padding: 20px; background: linear-gradient(180deg, #0f0c29 0%, #050505 100%); min-height: 100vh; box-sizing: border-box; padding-bottom: 80px; }
    h1 { font-family: 'Bungee', cursive; color: var(--accent); margin: 10px 0; font-size: 2.2rem; text-align: center; }

    /* Leaderboard */
    .leaderboard { background: var(--glass); border-radius: 24px; padding: 15px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.1); max-height: 250px; overflow-y: auto; scrollbar-width: none; }
    .lb-row { display: flex; align-items: center; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.03); border-radius: 16px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .rank { width: 30px; color: var(--accent); font-weight: 800; }
    .logo { width: 35px; height: 35px; margin-right: 15px; object-fit: contain; }
    .name { flex-grow: 1; text-align: left; font-weight: 600; font-size: 14px; }
    .val { font-family: 'Bungee', cursive; font-size: 14px; color: var(--accent); }

    /* Grids */
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 10px; margin-bottom: 25px; }
    .team-chip { padding: 15px 5px; background: var(--glass); border-radius: 20px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; text-align: center; }
    .team-chip.active { border-color: var(--accent); background: rgba(251, 176, 59, 0.1); transform: translateY(-5px); }
    .team-chip img { width: 40px; height: 40px; object-fit: contain; }
    
    .amt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 25px; }
    .amt-chip { padding: 12px 5px; background: var(--glass); border-radius: 12px; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); text-align: center; color: white; }
    .amt-chip.active { background: var(--accent); color: #000; }

    /* The Fix: QR Payment Card */
    .pay-card { background: white; border-radius: 32px; padding: 25px; color: #111; text-align: center; }
    .qr-holder { margin-bottom: 15px; display: none; animation: fadeIn 0.5s ease-in; }
    .qr-holder img { width: 220px; height: 220px; border: 4px solid #f1f1f1; border-radius: 20px; margin-bottom: 10px; }
    
    .instruction { font-size: 13px; font-weight: 800; color: #d32f2f; margin: 10px 0; text-transform: uppercase; }
    .sub-text { font-size: 11px; color: #666; margin-bottom: 15px; }

    .pay-btn { width: 100%; padding: 20px; border-radius: 20px; border: none; font-weight: 800; cursor: pointer; background: #000; color: #fff; font-size: 16px; transition: 0.3s; text-transform: uppercase; }
    .pay-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* Toast */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: white; padding: 10px 20px; border-radius: 50px; border: 1px solid var(--accent); font-size: 12px; z-index: 9999; animation: slideUp 0.5s ease-out; }
    
    @keyframes slideUp { from { bottom: -60px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>

<div class="app">
  <h1>FAN BATTLE ⚔️</h1>
  
  <div class="leaderboard" id="leaderboard">
    <p style="padding:40px; text-align: center;">Stadium Loading...</p>
  </div>

    <div class="amt-chip" onclick="setAmt(201, this)">201</div>
    <div class="amt-chip" onclick="setAmt(501, this)">501</div>

  <div class="pay-card">
    <div class="qr-holder" id="qrBox">
      <img src="my-qr.png" alt="Payment QR">
      <p class="instruction">📸 Screenshot & Pay via Gallery</p>

    selTeam = teams.find(t => t.name === name);
